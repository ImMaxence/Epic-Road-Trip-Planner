# Epic Road Trip Planner — production stack (Coolify "Docker Compose" build pack).
#
# Coolify generates the SERVICE_USER_* / SERVICE_PASSWORD_* values automatically on first deploy.
# Attach your domain to the `web` service (port 80) in the Coolify UI, e.g. https://tripplanner.mbonnici.fr
# For a local run: cp .env.example .env && docker compose -f docker-compose.yml -f compose.local.yml up -d --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: ${PUBLIC_URL:-https://tripplanner.mbonnici.fr}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - tiles-cache:/var/cache/nginx/tiles
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:-https://tripplanner.mbonnici.fr}
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${DATABASE_NAME:-roadtrip}
      DATABASE_USER: ${SERVICE_USER_MARIADB}
      DATABASE_PASSWORD: ${SERVICE_PASSWORD_MARIADB}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      GEO_SERVICE_URL: http://geo:8000
      # Shared secret for manual data refreshes from the administration (generated by Coolify).
      GEO_ADMIN_TOKEN: ${SERVICE_PASSWORD_GEOADMIN}
      # Routing engines per travel mode (FOSSGIS servers behind openstreetmap.org by default)
      OSRM_CAR_URL: ${OSRM_CAR_URL:-https://routing.openstreetmap.de/routed-car}
      OSRM_BIKE_URL: ${OSRM_BIKE_URL:-https://routing.openstreetmap.de/routed-bike}
      OSRM_FOOT_URL: ${OSRM_FOOT_URL:-https://routing.openstreetmap.de/routed-foot}
      # Google OAuth (Web client): administrator sign-in. Visitors have no account.
      # Authorised redirect URI: <PUBLIC_URL>/api/auth/google/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Administrators: comma-separated e-mails and/or @domains, signed in with Google. Empty = no administration.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Address offered in the "Feedback / bug" dialog (mailto). Empty = GitHub issues only.
      FEEDBACK_EMAIL: ${FEEDBACK_EMAIL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Set to true only if the domain is proxied by Cloudflare (real client IP for rate limiting).
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
    depends_on:
      db:
        condition: service_healthy
      geo:
        condition: service_started
    logging: *logging

  geo:
    build: ./geo-service
    restart: unless-stopped
    environment:
      # Monthly OpenStreetMap extract (≈5 GB download, ≈20 min of processing, then ≈200 MB on disk).
      # A regional extract is enough for a smaller server, e.g. .../europe/france/provence-alpes-cote-d-azur-latest.osm.pbf
      OSM_EXTRACT_URL: ${OSM_EXTRACT_URL:-https://download.geofabrik.de/europe/france-latest.osm.pbf}
      OSM_REFRESH_DAYS: ${OSM_REFRESH_DAYS:-30}
      # Optional: DataTourisme feed URL (free account on datatourisme.fr) for dated events.
      DATATOURISME_FEED_URL: ${DATATOURISME_FEED_URL:-}
      GEO_ADMIN_TOKEN: ${SERVICE_PASSWORD_GEOADMIN}
      DATATOURISME_REFRESH_HOURS: ${DATATOURISME_REFRESH_HOURS:-48}
    volumes:
      - geo-data:/data
    logging: *logging

  db:
    image: mariadb:11.8
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:-roadtrip}
      MARIADB_USER: ${SERVICE_USER_MARIADB}
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_MARIADB}
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_MARIADBROOT}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

volumes:
  db-data:
  geo-data:
  tiles-cache:
