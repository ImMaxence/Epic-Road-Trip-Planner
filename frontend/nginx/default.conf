# Epic Road Trip — static front (pre-rendered pages) + reverse proxy for /api and map tiles.

map $http_accept_language $preferred_lang {
    default   fr;
    "~*^en"   en;
    "~*^(de|es|it|nl|pt|pl|sv|da|no|fi|cs|ja|zh|ko)" en;
}

# Behind Coolify/Traefik (and Cloudflare) keep the original scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    # Docker embedded DNS: upstreams are resolved at request time, so nginx starts even if they are not up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml application/x-protobuf;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Language negotiation for the bare domain (x-default).
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "no-store" always;
        return 302 /$preferred_lang;
    }

    location ^~ /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # Security headers come from this server block only (avoid duplicates from helmet).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # OpenFreeMap tiles, styles, fonts and sprites, cached locally.
    # Browsers only talk to this origin: no third-party request, simpler privacy policy and CSP.
    location ^~ /tiles/ {
        set $ofm https://tiles.openfreemap.org;
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $ofm;
        proxy_ssl_server_name on;
        proxy_ssl_name tiles.openfreemap.org;
        proxy_set_header Host tiles.openfreemap.org;
        proxy_set_header User-Agent "EpicRoadTripPlanner/2.0 (+https://tripplanner.mbonnici.fr)";
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_cache tiles;
        proxy_cache_key $uri;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # MapLibre's worker is an ES module: browsers require a JavaScript MIME type.
        location ~* .mjs$ {
            types { }
            default_type text/javascript;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        try_files $uri =404;
    }

    # Service worker: always revalidated so new versions are picked up on the next visit.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(png|svg|webp|ico|woff2?|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~* ^/(robots\.txt|sitemap\.xml|llms(-full)?\.txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        default_type text/plain;
        types { application/xml xml; text/plain txt; }
        try_files $uri =404;
    }

    location / {
        # One canonical form per page: /fr/planifier/ → /fr/planifier
        rewrite ^/(.+)/$ /$1 permanent;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    # Unknown paths get a real 404 status with the SPA shell, which renders the "road closed" page.
    error_page 404 /index.html;
}
