# Local overrides (Docker Desktop): publish the site on http://localhost:${LOCAL_PORT:-8765} and use a small OSM extract.
#   docker compose -f docker-compose.yml -f compose.local.yml up -d --build
services:
  web:
    build:
      args:
        VITE_SITE_URL: http://localhost:${LOCAL_PORT:-8765}
    ports:
      - "${LOCAL_PORT:-8765}:80"
  backend:
    environment:
      PUBLIC_URL: http://localhost:${LOCAL_PORT:-8765}
  geo:
    environment:
      OSM_EXTRACT_URL: ${OSM_EXTRACT_URL:-https://download.geofabrik.de/europe/france/provence-alpes-cote-d-azur-latest.osm.pbf}
